# Render deployment configuration for FounderAI
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy order:
#   1. Create "founderai-api" web service first → copy its URL
#   2. Set VITE_API_URL on "founderai-frontend" to that URL, then deploy it

services:
  # ── API Server ────────────────────────────────────────────────────────────
  - type: web
    name: founderai-api
    runtime: node
    buildCommand: npm install -g pnpm && pnpm install && pnpm --filter @workspace/api-server run build
    startCommand: node artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Set these in the Render dashboard (mark as secret):
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GITLAB_TOKEN
        sync: false
      - key: GITLAB_USERNAME
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  # ── React Frontend (Static Site) ─────────────────────────────────────────
  - type: web
    name: founderai-frontend
    runtime: static
    buildCommand: npm install -g pnpm && pnpm install && pnpm --filter @workspace/founder-ai run build
    staticPublishPath: artifacts/founder-ai/dist/public
    # VITE_API_URL must be set in Render dashboard to your API service URL,
    # e.g. https://founderai-api.onrender.com
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
